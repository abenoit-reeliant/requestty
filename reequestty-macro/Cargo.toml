[package]
name = "reequestty-macro"
version = "0.5.0"
authors = ["Lutetium Vanadium"]
edition = "2018"
description = "The `questions` macro for `reequestty`"
homepage="https://github.com/Lutetium-Vanadium/reequestty#readme"
repository = "https://github.com/Lutetium-Vanadium/reequestty"
documentation="https://docs.rs/reequestty-macro"
readme = "README.md"
license = "MIT"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
syn = { version = "1", features = ["full"] }
quote = "1"
bitflags = "1.3"
rustversion = "1.0"
